<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" role="img" aria-label="Lior Dawit — Systems and Automation Builder">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#8b95a5" opacity="0.35"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="26 26" dur="5s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="type"><rect x="0" y="0" width="0" height="280"><animate attributeName="width" from="0" to="640" dur="1.4s" fill="freeze"/></rect></clipPath>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0.6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1000" height="280" fill="url(#dots)"/>
  <circle cx="200" cy="130" r="120" fill="#06b6d4" opacity="0.28" filter="url(#blur)">
    <animate attributeName="cx" values="200;420;200" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="150" r="130" fill="#8b5cf6" opacity="0.26" filter="url(#blur)">
    <animate attributeName="cx" values="800;600;800" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g clip-path="url(#type)">
    <text x="48" y="104" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="300" fill="#8b95a5">Lior <tspan font-weight="800" fill="url(#g)">Dawit</tspan></text>
  </g>
  <text x="50" y="146" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#8b95a5" opacity="0">Systems &amp; Automation Builder
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.8s" fill="freeze"/></text>
  <text x="50" y="182" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#06b6d4" opacity="0">API integrations  ·  data pipelines  ·  AI agents in production
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.8s" fill="freeze"/></text>
  <rect x="50" y="206" width="0" height="3" rx="1.5" fill="url(#g)"><animate attributeName="width" from="0" to="300" begin="2.2s" dur="0.9s" fill="freeze"/></rect>

  <!-- live terminal card -->
  <g transform="translate(690,48)">
    <rect width="270" height="150" rx="12" fill="#0b1220" fill-opacity="0.88" stroke="url(#g)" stroke-opacity="0.8"/>
    <circle cx="18" cy="16" r="4.5" fill="#ef4444"/><circle cx="34" cy="16" r="4.5" fill="#f59e0b"/><circle cx="50" cy="16" r="4.5" fill="#22c55e"/>
    <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5">
      <text x="18" y="52" fill="#67e8f9">$ map --process manual
        <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;0.08;0.3;0.7;0.95;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="18" y="76" fill="#c4b5fd">→ find what to automate
        <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.22;0.3;0.7;0.95;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="18" y="100" fill="#67e8f9">$ build &amp;&amp; ship --iterate
        <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.4;0.48;0.55;0.95;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="18" y="128" fill="#86efac">✓ running in production
        <animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.6;0.7;0.74;0.78;1" dur="9s" repeatCount="indefinite"/></text>
    </g>
  </g>
  <rect x="0" y="274" width="1000" height="3" fill="url(#g)" opacity="0.3"/>
  <rect x="0" y="274" width="180" height="3" fill="url(#g)"><animate attributeName="x" values="-180;1000" dur="4s" repeatCount="indefinite"/></rect>
</svg>
