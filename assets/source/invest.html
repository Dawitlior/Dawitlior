<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#070b14;overflow:hidden}#wrap{position:relative;width:800px;height:300px;overflow:hidden;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}canvas{display:block}.lab{position:absolute;font:11.5px "SF Mono",Menlo,Consolas,monospace;color:#cbd5e1;transform:translate(-50%,-50%);white-space:nowrap}.cap{position:absolute;left:0;right:0;top:12px;text-align:center;font:12px "SF Mono",Menlo,Consolas,monospace;color:#94a3b8}.bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,#06b6d4,#8b5cf6)}</style></head><body><div id="wrap">
<div class="cap">raw data → a decision, automatically, every night</div><div id="labs"></div><div class="bar" id="bar"></div></div>
<script src="three.min.js"></script><script src="common.js"></script><script>
const T=8,R=rng(21);
const SX=[-7.6,-2.6,2.6,7.6];
const labsEl=document.getElementById('labs');
function lab(txt,c){const d=document.createElement('div');d.className='lab';d.textContent=txt;d.style.color=c;labsEl.appendChild(d);return d}
const L=[lab('Sources','#22d3ee'),lab('Pipeline','#38bdf8'),lab('Models · backtest','#818cf8'),lab('Sheets · Discord','#a78bfa')];
const wire=(g,c,o)=>new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:c,transparent:true,opacity:o||0.95}));
// sources: small octahedra
const src=[];for(let i=0;i<8;i++){const m=wire(new THREE.OctahedronGeometry(0.34,0),i%2?0x22d3ee:0x7dd3fc);m.position.set(SX[0]+(R()-0.5)*0.8,(R()-0.5)*4.4,(R()-0.5)*2.6);m.userData={y:m.position.y,ph:R()*6.28};scene.add(m);src.push(m)}
const sg=glow('#22d3ee',5);sg.position.set(SX[0],0,0);
// pipeline torus
const tor=wire(new THREE.TorusGeometry(1.5,0.55,10,28),0x38bdf8);tor.position.set(SX[1],0,0);tor.rotation.y=Math.PI/2;scene.add(tor);
const tor2=wire(new THREE.TorusGeometry(1.0,0.3,8,20),0x7dd3fc,0.7);tor2.position.set(SX[1],0,0);tor2.rotation.y=Math.PI/2;scene.add(tor2);
const tg=glow('#38bdf8',4.6);tg.position.set(SX[1],0,0);
// models: bars
const bars=[];for(let i=0;i<9;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(0.34,1,0.34),new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(0.62+i*0.018,0.8,0.62),transparent:true,opacity:0.9}));m.position.x=SX[2]-1.9+i*0.47;scene.add(m);bars.push(m)}
const mg=glow('#818cf8',5);mg.position.set(SX[2],0.2,0);
const gline=[];
const lineMat=new THREE.LineBasicMaterial({color:0xc4b5fd});const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(9*3),3));const lineObj=new THREE.Line(lg,lineMat);scene.add(lineObj);
// delivery: sheet + ring
const sheet=wire(new THREE.BoxGeometry(2.6,1.9,0.05),0xa78bfa);sheet.position.set(SX[3],0.2,0);scene.add(sheet);
const gridPts=[];for(let i=-3;i<=3;i++){gridPts.push(new THREE.Vector3(i*0.37,-0.85,0),new THREE.Vector3(i*0.37,0.85,0))}for(let j=-2;j<=2;j++){gridPts.push(new THREE.Vector3(-1.15,j*0.36,0),new THREE.Vector3(1.15,j*0.36,0))}
sheet.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(gridPts),new THREE.LineBasicMaterial({color:0xa78bfa,transparent:true,opacity:0.45})));
const ring=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.045,8,28),new THREE.MeshBasicMaterial({color:0x5eead4}));ring.position.set(SX[3]+1.7,-1.4,0.8);scene.add(ring);
const dg=glow('#a78bfa',5);dg.position.set(SX[3],0.2,0);
// flow
const PK=[];for(let i=0;i<18;i++)PK.push(glow(i%2?'#22d3ee':'#c4b5fd',0.55));
const rail=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(SX[0]+0.9,0,0),new THREE.Vector3(SX[3]-1.6,0,0)]),new THREE.LineBasicMaterial({color:0x7dd3fc,transparent:true,opacity:0.2}));scene.add(rail);
const bar=document.getElementById('bar');
window.renderAt=function(t){
  const ang=2*Math.PI*t/T;
  src.forEach((m,i)=>{m.rotation.x=ang*(i%2?1:-1)+i;m.rotation.y=ang*2+i;m.position.y=m.userData.y+0.25*Math.sin(ang*2+m.userData.ph)});
  tor.rotation.x=ang*2;tor2.rotation.x=-ang*3;
  bars.forEach((m,i)=>{const h=0.5+1.3*(0.5+0.5*Math.sin(ang*2+i*0.7))*(0.55+0.45*Math.sin(i*1.3+1));m.scale.y=h;m.position.y=-1.1+h/2});
  const pa=lg.attributes.position;bars.forEach((m,i)=>{pa.setXYZ(i,m.position.x,m.scale.y-1.0,0.25)});pa.needsUpdate=true;
  sheet.rotation.y=0.35*Math.sin(ang);ring.rotation.x=ang*3;ring.rotation.y=ang*2;
  PK.forEach((s,i)=>{const u=((t/T)*2+i/PK.length)%1;s.position.set(SX[0]+0.9+u*(SX[3]-SX[0]-2.5),0.04*Math.sin(i),0);s.material.opacity=Math.sin(u*Math.PI)*0.95});
  [sg,tg,mg,dg].forEach((g,i)=>g.material.opacity=0.5+0.3*Math.sin(ang*3+i));
  const a=0.2*Math.sin(ang);
  cam.position.set(Math.sin(a)*5,3.2+0.4*Math.sin(ang*2),12.4*Math.cos(a));cam.lookAt(0,-0.1,0);
  renderer.render(scene,cam);
  SX.forEach((x,i)=>place(L[i],new THREE.Vector3(x,-2.65,0)));
  bar.style.width=(100*t/T)+'%';
};
window.ready=true;renderAt(0);
</script></body></html>
